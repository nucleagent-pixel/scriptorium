<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDEEE9">
<title>Scriptorium</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%229%22 fill=%22%23111%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-family=%22Arial%22 font-weight=%22700%22 font-size=%2217%22 text-anchor=%22middle%22 fill=%22%23D6F35B%22%3ES%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: icon rail at left (bottom bar on phones) + fluid bento cards on a warm gray ground. Single light look by team choice. */
:root{
  --bg:#EDEEE9; --card:#FFFFFF; --soft:#F5F6F2; --line:#DADBD4; --line2:#ECEDE7;
  --fg:#111111; --muted:#5E5E58; --muted2:#4A4A45; --faint:#8A8A83;
  --lime:#D6F35B; --ink:#111111; --inkfg:#FFFFFF;
  --g:#1E8A4C; --gbg:#E2F2E8; --gfg:#14613A;
  --a:#D69A00; --abg:#FBF0D2; --afg:#7A5200;
  --r:#D23B2A; --rbg:#FBE4E1; --rfg:#A42A1C;
  --display:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --body:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);font-size:14px;line-height:1.45}
a{color:var(--fg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;text-wrap:balance}
.shell{max-width:1440px;margin:0 auto;display:flex;gap:24px;align-items:flex-start;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav.rail{flex:0 0 88px;background:var(--card);border-radius:32px;padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:6px;position:sticky;top:calc(24px + env(safe-area-inset-top,0px))}
.logo{width:48px;height:48px;border-radius:16px;background:var(--ink);color:var(--inkfg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:600;margin-bottom:18px}
.navi{display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#55554F;font-size:11px;font-weight:500;padding:4px 0}
.navi .ic{width:48px;height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--fg)}
.navi[aria-current="page"]{color:var(--fg);font-weight:600}
.navi[aria-current="page"] .ic{background:var(--lime)}
.navi:hover .ic{background:var(--soft)}
.navi[aria-current="page"]:hover .ic{background:var(--lime)}
main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:24px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 4px 0}
.eyebrow{margin:0;font-size:14px;color:var(--muted)}
h1{margin-top:6px;font-size:44px;line-height:1.05;letter-spacing:-.02em}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.search{position:relative;display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;background:var(--card);border-radius:999px;min-width:260px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;font-size:14px;flex:1;color:var(--fg);min-width:0}
.results{position:absolute;top:54px;left:0;right:0;background:var(--card);border-radius:20px;box-shadow:0 12px 40px rgba(17,17,17,.12);padding:8px;z-index:30;max-height:360px;overflow:auto}
.results a{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--fg)}
.results a:hover,.results a:focus{background:var(--soft)}
.results small{display:block;color:var(--muted);font-size:12px}
.iconbtn{position:relative;width:48px;height:48px;border:0;border-radius:999px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--fg);flex:0 0 auto}
.iconbtn.sm{width:40px;height:40px;border:1px solid var(--line)}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:var(--ink);color:var(--inkfg);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:48px;height:48px;border-radius:999px;background:#DADBD4;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;border:0;flex:0 0 auto}
.btn{height:48px;padding:0 20px;border:0;border-radius:999px;background:var(--lime);color:var(--fg);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn.dark{background:var(--ink);color:var(--inkfg)}
.btn.ghost{background:var(--card);border:1px solid var(--line);height:40px;padding:0 16px;font-size:13px}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn.danger{background:var(--rbg);color:var(--rfg)}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:transparent;padding:0;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.link.u{text-decoration:underline;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:stretch}
.card{background:var(--card);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:18px;min-width:0}
.card.pad24{padding:24px}
.grow2{flex:2 1 620px}.grow1{flex:1 1 340px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:12px}
.cardhead h2{font-size:22px}
.sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.count{background:var(--bg);border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;font-family:var(--body)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted2);align-items:center}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;flex:0 0 8px}
.chip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip.g{background:var(--gbg);color:var(--gfg)}.chip.g .dot{background:var(--g)}
.chip.a{background:var(--abg);color:var(--afg)}.chip.a .dot{background:var(--a)}
.chip.r{background:var(--rbg);color:var(--rfg)}.chip.r .dot{background:var(--r)}
.chip.n{background:var(--soft);color:var(--muted2)}.chip.n .dot{background:var(--faint)}
.chip .off{font-weight:500}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 18px;background:var(--soft);border-radius:20px;text-decoration:none;color:var(--fg);border:0;text-align:left;width:100%}
.prow:hover{background:#EEEFE9}
.prow .nm{font-size:15px;font-weight:600}
.prow .mt{font-size:13px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.grp{display:flex;flex-direction:column;gap:8px}
.grplabel{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grplabel .count{font-size:12px;letter-spacing:0;color:var(--fg)}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--soft)}
.check{flex:0 0 22px;width:22px;height:22px;margin-top:0;border-radius:7px;border:1.5px solid var(--faint);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0;color:var(--inkfg)}
.check:hover{border-color:var(--ink)}
.check.on{background:var(--ink);border-color:var(--ink)}
.task .tt{font-size:14px;font-weight:500;line-height:1.35;border:0;background:transparent;padding:0;text-align:left}
.task .tm{font-size:12px;color:var(--muted);margin-top:4px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.note{height:156px;border-radius:18px;background:#F7F7F1;border:1px solid #E4E5DE;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.note p{margin:0;font-size:13px;line-height:1.45;flex:1;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.meeting{background:var(--ink);color:var(--inkfg);border-radius:28px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.meeting .lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#BDBDB6}
.meeting .ttl{font-family:var(--display);font-size:24px;font-weight:500}
.meeting .when{font-size:14px;color:#CFCFC8;margin-top:4px}
.meeting .btn{height:44px;align-self:flex-start}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar>div{height:100%;background:var(--ink);border-radius:99px}
.foot{margin:0;font-size:12px;color:var(--muted);padding:0 4px}
.empty{padding:18px;border-radius:18px;background:var(--soft);color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border-radius:999px;flex-wrap:wrap}
.tabs button{height:40px;padding:0 18px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:500}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--inkfg);font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.pcard{background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.pcard h2{font-size:20px;line-height:1.2}
.pcard{gap:14px}
.pmore{align-self:flex-start;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:4px 0;font:inherit;font-size:13px;font-weight:600;color:var(--muted2);cursor:pointer}
.pmore:hover{color:var(--fg)}
.facts{margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--soft);border-radius:14px;padding:10px 12px;min-width:0}
.facts dt{font-size:11px;color:var(--muted)}
.facts dd{margin:2px 0 0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{height:28px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;background:var(--card);color:var(--muted2);border:1px solid var(--line)}
.stage.on{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.plinks{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;font-weight:600;border-top:1px solid var(--line2);padding-top:14px}
.plinks a{text-decoration:none}
.plinks span{color:var(--faint);font-weight:500}
.tablewrap{overflow-x:auto}
table.t{width:100%;min-width:760px;border-collapse:separate;border-spacing:0 8px;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:500;padding:0 16px}
table.t td{padding:14px 16px;background:var(--soft)}
table.t td:first-child{border-radius:16px 0 0 16px;font-weight:600}
table.t td:last-child{border-radius:0 16px 16px 0;text-align:right;padding:8px 12px;white-space:nowrap}
.pill{font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);white-space:nowrap}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.col{flex:1 1 300px;min-width:0;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.colhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.colhead h2{font-size:20px}
.litem{background:var(--soft);border-radius:20px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;text-align:left;width:100%;color:var(--fg)}
.litem.v{flex-direction:column;align-items:stretch;gap:10px}
.litem .n{font-size:16px;font-weight:600}
.litem .m{font-size:13px;color:var(--muted);margin-top:3px}
.big{font-family:var(--display);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.thin{height:8px;border-radius:99px;background:#E2E3DC;overflow:hidden}
.thin>div{height:100%;background:var(--ink);border-radius:99px}
.strip{background:var(--card);border-radius:24px;padding:18px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.kan{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.kcol{flex:1 1 280px;min-width:0;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.kcard{background:var(--soft);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--soft);text-align:left;width:100%;color:var(--fg)}
.kcard.sel{background:var(--card);border-color:var(--ink)}
.kcard .top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.kcard .prod{color:var(--muted)}
.prio{font-weight:600;padding:2px 8px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:11px}
.prio.Alta{background:var(--ink);color:var(--inkfg);border-color:var(--ink)}
.kcard .tt{font-size:14px;font-weight:600;line-height:1.35}
.kcard .bt{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.who{width:28px;height:28px;border-radius:99px;background:#DADBD4;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--fg)}
.overdue{color:var(--rfg);font-weight:600}
aside.detail{flex:1 1 340px;min-width:0;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--inkfg);border-color:var(--ink);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.fgrid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);background:var(--soft);border-radius:14px;padding:8px 12px}
.fgrid select,.fgrid input{border:0;background:transparent;font-size:14px;font-weight:600;padding:2px 0;outline:0;color:var(--fg);width:100%}
.mini{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.comment{background:var(--soft);border-radius:14px;padding:10px 12px;font-size:13px;white-space:pre-wrap;word-break:break-word}
.comment b{font-weight:600}
.comment small{color:var(--muted);font-size:11px;margin-left:6px}
.inline{display:flex;gap:8px;align-items:center;background:var(--soft);border-radius:999px;padding:4px 4px 4px 16px}
.inline input{flex:1;border:0;background:transparent;outline:0;min-width:0;font-size:13px}
.fl{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;text-decoration:none;padding:10px 12px;border-radius:14px;background:var(--soft);word-break:break-all}
.cal{flex:2 1 620px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{font-size:12px;color:var(--muted);font-weight:600;padding:0 6px 4px}
.cell{min-height:96px;border-radius:14px;background:var(--soft);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0;border:0;text-align:left;color:var(--fg)}
.cell.out{background:#FAFAF7;color:var(--faint)}
.cell .d{font-size:12px;font-weight:500;width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.cell.today .d{background:var(--lime);font-weight:700;color:var(--fg)}
.ev{font-size:11px;font-weight:600;border-radius:8px;padding:3px 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;text-align:left;width:100%}
.ev.m{background:var(--ink);color:var(--inkfg)}
.ev.f{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.ev.sel{outline:2px solid var(--lime);outline-offset:1px}
.calaside{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:24px}
textarea.acta{width:100%;min-height:200px;border:1px solid var(--line);border-radius:18px;padding:14px 16px;resize:vertical;background:var(--soft);font-size:14px;line-height:1.5;outline:0}
textarea.acta:focus{border-color:var(--ink)}
.saved{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.agents{flex:0 1 300px;min-width:240px;display:flex;flex-direction:column;gap:10px}
.agent{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border-radius:22px;padding:16px;border:1.5px solid var(--card);width:100%;color:var(--fg)}
.agent.sel{border-color:var(--ink)}
.agent .ai{width:40px;height:40px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.agent.sel .ai{background:var(--lime)}
.agent .an{font-weight:600;font-size:14px;display:block}
.agent .ad{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.agent .soon{display:inline-block;margin-top:6px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--abg);color:var(--afg)}
.chat{flex:2 1 460px;min-width:0;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;min-height:600px}
.msgs{flex:1;display:flex;flex-direction:column;gap:14px;overflow:auto;max-height:62vh;padding-right:4px}
.msg{max-width:85%;border-radius:20px;padding:12px 16px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--inkfg);border-bottom-right-radius:6px}
.msg.a{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg .att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.msg .att span{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.16)}
.msg.a .att span{background:var(--card)}
.msgtools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.composer{border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px}
.composer textarea{border:0;outline:0;resize:none;background:transparent;font-size:14px;min-height:48px}
.composer .cb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.attlist{display:flex;flex-wrap:wrap;gap:6px}
.attlist span{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);display:inline-flex;gap:6px;align-items:center}
.attlist button{border:0;background:transparent;padding:0;font-size:14px;line-height:1}
.saved-list{flex:1 1 260px;min-width:0;background:var(--card);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.sitem{background:var(--soft);border-radius:16px;padding:12px 14px;border:0;text-align:left;width:100%;color:var(--fg)}
.sitem .st{font-size:14px;font-weight:600}
.sitem .sm{font-size:12px;color:var(--muted);margin-top:2px}
.banner{background:var(--abg);color:var(--afg);border-radius:18px;padding:12px 16px;font-size:13px;font-weight:500;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.info{background:var(--card);color:var(--muted2)}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.35);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) 16px 40px}
.modal{background:var(--card);border-radius:28px;padding:28px;width:100%;max-width:560px;display:flex;flex-direction:column;gap:16px;box-shadow:0 24px 60px rgba(17,17,17,.2)}
.modal h2{font-size:24px}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:400;color:var(--fg);background:var(--card);outline:0;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:110px;resize:vertical}
.field .hint{font-weight:400;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:500;color:var(--fg);background:var(--soft);padding:6px 12px;border-radius:99px}
.mrow{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.mrow .spacer{flex:1}
.pre{white-space:pre-wrap;word-break:break-word;background:var(--soft);border-radius:18px;padding:16px;font-size:14px;max-height:55vh;overflow:auto}
.pop{position:absolute;top:54px;right:0;width:300px;background:var(--card);border-radius:20px;box-shadow:0 12px 40px rgba(17,17,17,.12);padding:14px;z-index:30;display:flex;flex-direction:column;gap:8px;color:var(--fg);text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--inkfg);padding:12px 18px;border-radius:999px;font-size:13px;font-weight:600;z-index:60}
@media (max-width:760px){
  .shell{flex-direction:column;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  nav.rail{position:fixed;top:auto;bottom:0;left:0;right:0;flex-direction:row;justify-content:space-around;border-radius:24px 24px 0 0;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:40;box-shadow:0 -6px 24px rgba(17,17,17,.08);gap:0}
  .logo{display:none}
  .navi{font-size:10px}
  .navi .ic{width:40px;height:40px}
  h1{font-size:34px}
  .search{min-width:0;flex:1 1 100%}
  .card{padding:20px}
  .grow2,.grow1,.cal{flex-basis:100%}
  .cell{min-height:64px;padding:4px}
  .ev{font-size:10px;padding:2px 4px}
  .msgs{max-height:none}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- acceso ---------- */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate .card{width:100%;max-width:420px}
.gate .logo{margin:0 0 4px}
.gate form{display:flex;flex-direction:column;gap:14px}
.gate .err{color:var(--rfg,#9B2418);font-size:13px;font-weight:500;min-height:1em}
.gate .alt{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13px}
.gate .alt button{background:none;border:0;padding:0;color:var(--muted2);text-decoration:underline;cursor:pointer;font:inherit}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="gate" class="gate"><div class="card"><h2>Cargando Scriptorium…</h2></div></div>
<div class="shell hidden" id="shell">
  <nav class="rail" aria-label="Secciones" id="rail"></nav>
  <main id="main" aria-live="polite">
    <div class="card"><h2>Cargando Scriptorium…</h2><p class="sub">Conectando con los datos del equipo.</p></div>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* ---------- icons ---------- */
var I = {
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  box:'<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  check:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/>',
  cal:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>',
  bell:'<path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  arrow:'<path d="M7 17 17 7M8 7h9v9"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  down:'<path d="m6 9 6 6 6-6"/>',
  up:'<path d="m6 15 6-6 6 6"/>',
  left:'<path d="m15 6-6 6 6 6"/>',
  right:'<path d="m9 6 6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  tick:'<path d="m5 12.5 4.5 4.5L19 7"/>',
  clip:'<path d="m20 11.5-8.5 8.5a5 5 0 0 1-7-7L13 4.5a3.3 3.3 0 0 1 4.7 4.7L9.3 17.6a1.7 1.7 0 0 1-2.4-2.4L15 7"/>',
  img:'<rect x="3.5" y="4.5" width="17" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m4 18 5-5 4 4 3-3 4 4"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m14 6 4 4"/>'
};
function ic(n,s,extra){s=s||20;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '+(extra||'')+'>'+I[n]+'</svg>';}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function safeUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseISO(s){if(!s)return null;var p=String(s).split('-');if(p.length<3)return null;return new Date(+p[0],+p[1]-1,+p[2]);}
function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var DIAL=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function shortDate(s){var d=parseISO(s);if(!d)return '';var n=daysBetween(today(),d);if(n===0)return 'Hoy';if(n===1)return 'Mañana';if(n===-1)return 'Ayer';return d.getDate()+' '+MES[d.getMonth()];}
function longDate(d){return cap(DIAL[d.getDay()])+' '+d.getDate()+' de '+MES[d.getMonth()];}
function fmtTime(t){if(!t)return '';var p=t.split(':');var h=+p[0],m=p[1]||'00';var ap=h<12?'a. m.':'p. m.';var hh=h%12||12;return hh+':'+m+' '+ap;}
function initials(n){n=String(n||'?').trim();var p=n.split(/\s+/);return ((p[0]||'?').slice(0,2)).toUpperCase();}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}

/* ---------- ROAS traffic light ---------- */
function tone(v){v=parseFloat(v);if(isNaN(v))return 'n';if(v>=1.8)return 'g';if(v>=1.43)return 'a';return 'r';}
function chip(c){
  var v=parseFloat(c.roas);var t=tone(v);
  var txt=esc(c.code)+' '+(isNaN(v)?'sin dato':v.toFixed(2));
  var off=(!isNaN(v)&&v<1.25)?'<span class="off">· apagar</span>':'';
  var label='ROAS '+c.code+' '+(isNaN(v)?'sin dato':v.toFixed(2))+(off?', por debajo de 1.25: apagar':'');
  return '<span class="chip '+t+'" title="'+esc(label)+'"><span class="dot"></span>'+txt+off+'</span>';
}
function parseCountries(s){
  return String(s||'').split(/[,;\n]+/).map(function(x){x=x.trim();if(!x)return null;var m=x.match(/^([A-Za-z]{2,3})\s*[:=]?\s*([0-9]+(?:[.,][0-9]+)?)?$/);if(!m)return null;return {code:m[1].toUpperCase(),roas:m[2]?parseFloat(m[2].replace(',','.')):null};}).filter(Boolean);
}
function pCountries(p){if(!p)return [];if(p.offer&&ROAS.loaded){return ROAS.rows.filter(function(r){return r.offer_id===p.offer;}).sort(function(a,b){return b.pauta-a.pauta;}).map(function(r){return {code:r.country,roas:r.roas};});}return p.countries||[];}
function offerName(id){var o=ROAS.offers.find(function(x){return x.id===id;});return o?o.name:'';}
function countriesText(cs){return (cs||[]).map(function(c){return c.code+(c.roas!=null?' '+c.roas:'');}).join(', ');}

/* ---------- data layer ---------- */
var COLS=['products','found','lines','tasks','notes','events','chats','deliverables'];
var S={products:[],found:[],lines:[],tasks:[],notes:[],events:[],chats:[],deliverables:[],members:[],config:null,loaded:{},live:true};
var sb=null, SESSION=null, ME=null, channel=null, lastLoad=0;
var ROAS={loaded:false,offers:[],rows:[],from:'',to:'',updatedAt:'',error:''};
var UI={view:'inicio',ptab:'activos',taskSel:null,taskScope:'mine',prio:'todas',showDone:false,showBlocked:false,
  calMonth:null,calSel:null,agent:'desarrollador',chatId:null,chatProduct:'',pending:false,draft:'',atts:[],search:'',bell:false,me:'',pOpen:{}};

function cfg(){var c=S.config||{};return {members:S.members.filter(function(m){return m.role!=='pendiente';}).map(function(m){return m.name;}),goals:c.goals||[]};}

function rowToDoc(r){var d=r.data||{};return Object.assign({},d,{id:r.id,createdAt:d.createdAt||r.created_at});}
function upsertLocal(r){if(!r||COLS.indexOf(r.col)<0)return;var doc=rowToDoc(r);var arr=S[r.col];var i=arr.findIndex(function(x){return x.id===doc.id;});if(i>=0)arr[i]=doc;else arr.push(doc);}
function dropLocal(id){COLS.forEach(function(c){S[c]=S[c].filter(function(x){return x.id!==id;});});}
function chk(r){if(r&&r.error)throw r.error;return r;}
var store={
  add:function(col,data){data.createdAt=data.createdAt||new Date().toISOString();
    return sb.from('sc_items').insert({col:col,data:data}).select('id,col,data,created_at').single().then(chk).then(function(r){upsertLocal(r.data);scheduleRender();return r.data.id;}).catch(fail);},
  update:function(col,id,data){
    var it=byId(col,id);if(it)Object.assign(it,data);scheduleRender();
    return sb.rpc('sc_patch',{p_id:id,p_patch:data}).then(chk).catch(fail);},
  remove:function(col,id){
    dropLocal(id);scheduleRender();
    return sb.from('sc_items').delete().eq('id',id).then(chk).catch(fail);},
  setConfig:function(data){
    S.config=Object.assign({},S.config||{},data);scheduleRender();
    return sb.rpc('sc_patch_config',{p_patch:data}).then(chk).catch(fail);}
};
function fail(e){
  var m=String(e&&(e.message||e.code)||'');
  if(/permission|row-level|401|403|JWT/i.test(m))toast('No tienes permiso para guardar. Vuelve a iniciar sesión.');
  else toast('No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  console.warn(e);
}
function byId(col,id){return S[col].find(function(x){return x.id===id;});}

/* ---------- derived ---------- */
var STAGES=[['pdf','PDF'],['guiones','Guiones'],['videos','Videos'],['script','Script WhatsApp'],['campanas','Campañas']];
function activeProducts(){return S.products.filter(function(p){return (p.status||'activo')==='activo';}).sort(function(a,b){return String(a.name).localeCompare(b.name);});}
function productName(id){var p=byId('products',id);return p?p.name:'';}
var WARM_DAYS=12;
function lineState(l){
  var st=l.status||'calentando';
  if(st==='calentando'){var s=parseISO(l.warmStart);if(s){var day=daysBetween(s,today())+1;if(day>WARM_DAYS){var ready=new Date(s);ready.setDate(ready.getDate()+WARM_DAYS);return {status:'disponible',readySince:iso(ready)};}return {status:'calentando',day:Math.max(1,day)};}return {status:'calentando',day:1};}
  return {status:st};
}
function sortNum(a,b){return String(a.num).localeCompare(String(b.num),undefined,{numeric:true});}
function myTasks(){var me=UI.me;return S.tasks.filter(function(t){return (!me||t.who===me)&&(t.status==='Pendiente'||t.status==='En curso');});}
var PR={Alta:0,Media:1,Baja:2};
function taskSort(a,b){var da=a.due||'9999',dbb=b.due||'9999';if(da!==dbb)return da<dbb?-1:1;return (PR[a.priority]||1)-(PR[b.priority]||1);}
function taskMeta(t){var bits=[];if(t.priority)bits.push(t.priority);if(t.due)bits.push(shortDate(t.due));var pn=productName(t.product);if(pn)bits.push(pn);if(!UI.me||UI.taskScope==='team')if(t.who&&UI.view!=='inicio')bits.push(t.who);return bits.join(' · ');}
function isOverdue(t){var d=parseISO(t.due);return d&&d<today()&&t.status!=='Hecha'&&t.status!=='Descartada';}

/* occurrences of events in [from,to] */
function occurrences(from,to){
  var out=[];
  S.events.forEach(function(e){
    var s=parseISO(e.date);if(!s)return;
    if(!e.repeat||e.repeat==='no'){if(s>=from&&s<=to)out.push({ev:e,date:iso(s)});return;}
    var d=new Date(s);
    if(e.repeat==='semanal'){if(d<from){var k=Math.ceil(daysBetween(d,from)/7);d.setDate(d.getDate()+k*7);}
      while(d<=to){out.push({ev:e,date:iso(d)});d.setDate(d.getDate()+7);}}
    else if(e.repeat==='mensual'){var dom=s.getDate();var y=from.getFullYear(),m=from.getMonth()-1;
      for(var i=0;i<4;i++){var c=new Date(y,m+i,dom);if(c.getDate()!==dom)continue;if(c>=s&&c>=from&&c<=to)out.push({ev:e,date:iso(c)});}}
  });
  out.sort(function(a,b){return a.date===b.date?String(a.ev.time||'').localeCompare(String(b.ev.time||'')):(a.date<b.date?-1:1);});
  return out;
}
function nextMeeting(){
  var now=new Date();var from=today();var to=new Date(from);to.setDate(to.getDate()+62);
  var occ=occurrences(from,to).filter(function(o){if(o.ev.kind!=='reunion')return false;var d=parseISO(o.date);var t=(o.ev.end||o.ev.time||'23:59').split(':');d.setHours(+t[0],+(t[1]||0));return d>=now;});
  return occ[0]||null;
}
function whenText(o){var d=parseISO(o.date);var n=daysBetween(today(),d);var pre=n===0?'Hoy, ':n===1?'Mañana, ':'';return pre+DIAL[d.getDay()]+' '+d.getDate()+' de '+MES[d.getMonth()]+(o.ev.time?' · '+fmtTime(o.ev.time):'');}

/* ---------- nav & header ---------- */
var VIEWS=[['inicio','Inicio','home'],['productos','Productos','box'],['lineas','Líneas','phone'],['tareas','Tareas','check'],['calendario','Calendario','cal'],['agentes','Agentes','spark']];
function renderRail(){
  var h='<div class="logo" aria-hidden="true">S</div>';
  VIEWS.forEach(function(v){h+='<a class="navi" href="#'+v[0]+'"'+(UI.view===v[0]?' aria-current="page"':'')+'><span class="ic">'+ic(v[2],22)+'</span>'+v[1]+'</a>';});
  document.getElementById('rail').innerHTML=h;
}
function bellItems(){var t=today();return myTasks().filter(function(x){var d=parseISO(x.due);return d&&d<=t;}).sort(taskSort);}
function headerTools(extra){
  var b=bellItems();
  var h='<div class="tools">';
  h+='<div class="search">'+ic('search',18)+'<input id="q" aria-label="Buscar" placeholder="Buscar producto, línea o tarea" value="'+esc(UI.search)+'" autocomplete="off">'+searchResults()+'</div>';
  h+='<div style="position:relative"><button class="iconbtn" data-a="bell" aria-label="Avisos, '+b.length+' para hoy o atrasadas" aria-expanded="'+UI.bell+'">'+ic('bell',20)+(b.length?'<span class="badge">'+b.length+'</span>':'')+'</button>';
  if(UI.bell){h+='<div class="pop" role="dialog" aria-label="Avisos"><div class="mini">Para hoy o atrasadas</div>';
    if(!b.length)h+='<div class="sub">Nada vence hoy. Bien.</div>';
    b.forEach(function(t){h+='<a class="fl" href="#tareas" data-a="opentask" data-id="'+t.id+'">'+esc(t.title)+' <span class="'+(isOverdue(t)?'overdue':'')+'" style="margin-left:auto;font-weight:500">'+esc(shortDate(t.due))+'</span></a>';});
    h+='</div>';}
  h+='</div>';
  h+=extra||'';
  h+='<button class="avatar" data-a="whoami" aria-label="'+(UI.me?'Eres '+esc(UI.me)+'. Cambiar':'Elegir quién eres')+'" title="'+esc(UI.me||'¿Quién eres?')+'">'+esc(UI.me?initials(UI.me):'?')+'</button>';
  return h+'</div>';
}
function searchResults(){
  var q=UI.search.trim().toLowerCase();if(q.length<2)return '';
  var r=[];
  S.products.forEach(function(p){if(String(p.name).toLowerCase().indexOf(q)>=0)r.push({h:'#productos',id:p.id,k:'product',t:p.name,s:'Producto · '+(p.status||'activo')});});
  S.lines.forEach(function(l){if(('línea '+l.num+' linea '+l.num+' '+(l.phone||'')).toLowerCase().indexOf(q)>=0)r.push({h:'#lineas',id:l.id,k:'line',t:'Línea '+l.num,s:lineState(l).status});});
  S.tasks.forEach(function(t){if(String(t.title).toLowerCase().indexOf(q)>=0)r.push({h:'#tareas',id:t.id,k:'task',t:t.title,s:'Tarea · '+t.status});});
  var h='<div class="results" role="listbox">';
  if(!r.length)h+='<div class="sub" style="padding:10px 12px">Sin resultados para “'+esc(UI.search)+'”.</div>';
  r.slice(0,12).forEach(function(x){h+='<a href="'+x.h+'" data-a="searchgo" data-k="'+x.k+'" data-id="'+x.id+'">'+esc(x.t)+'<small>'+esc(x.s)+'</small></a>';});
  return h+'</div>';
}
function top(eyebrow,title,extra){return '<header class="top"><div><p class="eyebrow">'+eyebrow+'</p><h1>'+esc(title)+'</h1></div>'+headerTools(extra)+'</header>';}
function banners(){
  var h='';
  if(!S.live)h+='<div class="banner">Se perdió la conexión en vivo. Lo que cambies se guarda, pero puede que no veas lo de los demás hasta reconectar.</div>';
  var demo=COLS.some(function(c){return S[c].some(function(x){return x.demo;});});
  if(demo&&UI.view==='inicio')h+='<div class="banner info"><span>Hay datos de ejemplo cargados para que pruebes. Cuando quieran empezar con lo real, bórrenlos.</span><button class="btn ghost" data-a="cleardemo">Borrar datos de ejemplo</button></div>';
  return h;
}

/* ---------- views ---------- */
function vInicio(){
  var me=UI.me;var d=new Date();
  var h=top(cap(DIAL[d.getDay()])+', '+d.getDate()+' de '+MESL[d.getMonth()],me?'Hola, '+me:'Hola',
    '<a class="btn dark" href="#agentes" style="height:48px">'+ic('spark',18,'style="color:var(--lime)"')+'Agentes</a>');
  h+=banners();
  h+='<div class="row">';
  // products
  var ps=activeProducts();
  h+='<section class="card grow2"><div class="cardhead"><div><h2>Productos activos</h2><p class="sub">ROAS de los últimos 3 días, por país</p></div>'+legend()+'</div><div class="grp" style="gap:10px">';
  if(!ps.length)h+='<div class="empty">Todavía no hay productos activos.<button class="btn ghost" data-a="newproduct">'+ic('plus',16)+'Nuevo producto</button></div>';
  ps.forEach(function(p){h+=productRow(p);});
  h+='</div><a class="link" href="#productos">Ver todos los productos '+ic('arrow',14)+'</a></section>';
  // my tasks
  var mt=myTasks().sort(taskSort);
  var cur=mt.filter(function(t){return t.status==='En curso';}),pen=mt.filter(function(t){return t.status==='Pendiente';});
  h+='<section class="card grow1"><div class="cardhead" style="align-items:center"><h2>'+(me?'Mis tareas':'Tareas abiertas')+'</h2><button class="iconbtn sm" data-a="newtask" aria-label="Nueva tarea">'+ic('plus',18)+'</button></div>';
  if(!mt.length)h+='<div class="empty">'+(me?'No tienes tareas abiertas.':'No hay tareas abiertas.')+'</div>';

function api(path,opts){
  opts=opts||{};var raw=opts.raw;delete opts.raw;
  return sb.auth.getSession().then(function(r){
    var tok=r.data&&r.data.session&&r.data.session.access_token;
    opts.headers=Object.assign({},opts.headers||{},tok?{Authorization:'Bearer '+tok}:{});
    return fetch(path,opts);
  }).then(function(res){if(raw)return res;return res.json().catch(function(){return {};}).then(function(j){if(!res.ok){var e=new Error(j.error||('HTTP '+res.status));e.status=res.status;throw e;}return j;});});
}
var gateMode='login',gateMsg='',gateEmail='';

  else if(mode==='error')h+='<h2>No se pudo abrir Scriptorium</h2><p class="sub" style="margin:0">'+esc(gateMsg||'Revisa tu conexión y recarga la página.')+'</p><button class="btn dark" onclick="location.reload()">Recargar</button>';
  else if(mode==='pending')h+='<h2>Tu acceso está pendiente</h2><p class="sub" style="margin:0">Ya creaste tu cuenta'+(ME?' como '+esc(ME.name):'')+'. Un admin del equipo tiene que aprobarte desde su cuenta en Scriptorium. Cuando lo haga, recarga esta página.</p><div class="alt"><button type="button" data-g="reload">Ya me aprobaron</button><button type="button" data-g="logout">Cerrar sesión</button></div>';
  else if(mode==='reset')h+='<h2>Nueva contraseña</h2><form data-f="gate"><label class="field" for="g_pw">Contraseña nueva <span class="hint">mínimo 8 caracteres</span><input id="g_pw" name="password" type="password" minlength="8" required autocomplete="new-password"></label><div class="err" role="alert">'+esc(gateMsg)+'</div><button class="btn dark" type="submit">Guardar contraseña</button></form>';
  else{
    var up=mode==='signup',forgot=mode==='forgot';
    h+='<h2>'+(up?'Crear cuenta':forgot?'Recuperar contraseña':'Entrar a Scriptorium')+'</h2><form data-f="gate">';
    if(up)h+='<label class="field" for="g_name">Tu nombre<input id="g_name" name="name" required autocomplete="name" placeholder="Como te conoce el equipo"></label>';
    h+='<label class="field" for="g_email">Correo<input id="g_email" name="email" type="email" required autocomplete="email" value="'+esc(gateEmail)+'"></label>';
    if(!forgot)h+='<label class="field" for="g_pw">Contraseña'+(up?' <span class="hint">mínimo 8 caracteres</span>':'')+'<input id="g_pw" name="password" type="password" '+(up?'minlength="8" ':'')+'required autocomplete="'+(up?'new-password':'current-password')+'"></label>';
    h+='<div class="err" role="alert">'+esc(gateMsg)+'</div><button class="btn dark" type="submit">'+(up?'Crear cuenta':forgot?'Enviarme el enlace':'Entrar')+'</button></form>';
    h+='<div class="alt">'+(up||forgot?'<button type="button" data-g="login">Ya tengo cuenta</button>':'<button type="button" data-g="signup">Crear cuenta</button><button type="button" data-g="forgot">Olvidé mi contraseña</button>')+'</div>';
  }
  g.innerHTML=h+'</div>';
  var f=g.querySelector(gateEmail&&mode==='login'?'#g_pw':'input');if(f)f.focus();
}

  if(gateMode==='signup')p=sb.auth.signUp({email:v.email,password:v.password,options:{data:{full_name:v.name},emailRedirectTo:location.origin}}).then(function(r){if(r.error)throw r.error;if(!r.data.session)showGate('login','Te enviamos un correo para confirmar tu cuenta. Ábrelo y luego entra aquí.');});
  else if(gateMode==='forgot')p=sb.auth.resetPasswordForEmail(v.email,{redirectTo:location.origin}).then(function(r){if(r.error)throw r.error;showGate('login','Si el correo existe, te llegó un enlace para crear una contraseña nueva.');});
  else if(gateMode==='reset')p=sb.auth.updateUser({password:v.password}).then(function(r){if(r.error)throw r.error;toast('Contraseña guardada');onSession(r.data&&SESSION,true);});
  else p=sb.auth.signInWithPassword({email:v.email,password:v.password}).then(function(r){if(r.error)throw r.error;});
  p.catch(function(e){var m=String(e&&e.message||'');
    var t=/Invalid login/i.test(m)?'Correo o contraseña incorrectos.':/not confirmed/i.test(m)?'Confirma tu correo antes de entrar (revisa tu bandeja).':/already registered/i.test(m)?'Ese correo ya tiene cuenta. Entra o recupera la contraseña.':/Password/i.test(m)?'La contraseña debe tener al menos 8 caracteres.':'No se pudo. '+m;
    showGate(gateMode,t);});
});

function loadAll(){
  var all=[],size=1000;
  function page(from){return sb.from('sc_items').select('id,col,data,created_at').order('created_at').range(from,from+size-1).then(chk).then(function(r){all=all.concat(r.data);return r.data.length===size?page(from+size):all;});}
  return Promise.all([page(0),sb.from('sc_config').select('data').eq('id','main').maybeSingle().then(chk),loadMembers()]).then(function(res){
    COLS.forEach(function(c){S[c]=[];S.loaded[c]=true;});
    res[0].forEach(upsertLocal);
    S.config=res[1].data?res[1].data.data:{};
    lastLoad=Date.now();scheduleRender();
  });
}
function loadMembers(){return sb.from('sc_members').select('user_id,email,name,role').order('name').then(chk).then(function(r){S.members=r.data||[];var me=ME&&S.members.find(function(m){return m.user_id===ME.user_id;});if(me){ME=me;UI.me=me.name;}scheduleRender();});}
function loadRoas(){return api('/api/roas').then(function(r){ROAS.offers=r.offers||[];ROAS.rows=r.rows||[];ROAS.from=r.from;ROAS.to=r.to;ROAS.updatedAt=r.updatedAt;ROAS.error=r.error||'';ROAS.loaded=!r.error||ROAS.rows.length>0;scheduleRender();}).catch(function(e){ROAS.error='No se pudo leer el ROAS del Dashboard.';console.warn(e);scheduleRender();});}
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel('scriptorium')
    .on('postgres_changes',{event:'*',schema:'public',table:'sc_items'},function(p){if(p.eventType==='DELETE'){dropLocal(p.old&&p.old.id);}else upsertLocal(p.new);scheduleRender();})
    .on('postgres_changes',{event:'*',schema:'public',table:'sc_config'},function(p){if(p.new&&p.new.id==='main'){S.config=p.new.data||{};scheduleRender();}})
    .on('postgres_changes',{event:'*',schema:'public',table:'sc_members'},function(){loadMembers();})
    .subscribe(function(status){var was=S.live;S.live=status==='SUBSCRIBED';if(S.live&&!was)loadAll();if(was!==S.live)scheduleRender();});
}
var roasTimer=null,booted=false;
function bootData(){
  hideGate();route();
  loadAll().then(function(){if(!booted){booted=true;subscribe();}}).catch(function(e){console.warn(e);showGate('error','No se pudieron leer los datos del equipo.');});
  loadRoas();loadMcp();clearInterval(roasTimer);roasTimer=setInterval(loadRoas,10*60*1000);
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&ME&&ME.role!=='pendiente'&&Date.now()-lastLoad>5*60*1000){loadAll().catch(function(){});loadRoas();}});
function onSession(session,force){
  var prev=SESSION;SESSION=session;
  if(!session){ME=null;booted=false;if(channel){sb.removeChannel(channel);channel=null;}clearInterval(roasTimer);if(gateMode!=='reset')showGate('login');return;}
  if(!force&&prev&&prev.user&&prev.user.id===session.user.id&&ME)return;
  api('/api/me').then(function(me){ME=me;UI.me=me.name;if(me.role==='pendiente'){showGate('pending');return;}bootData();})
    .catch(function(e){if(e.status===401){sb.auth.signOut();return;}showGate('error','No se pudo verificar tu cuenta. '+e.message);});
}
function start(){
  showGate('loading');
  fetch('/api/config').then(function(r){return r.json();}).then(function(c){
    if(!c.supabaseUrl||!c.supabaseAnonKey)throw new Error('Falta configurar Supabase en Cloudflare.');
    sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);
    sb.auth.onAuthStateChange(function(ev,session){setTimeout(function(){if(ev==='PASSWORD_RECOVERY'){SESSION=session;showGate('reset');return;}if(ev==='TOKEN_REFRESHED'){SESSION=session;return;}if(gateMode==='reset'&&session)return;onSession(session);},0);});
  }).catch(function(e){showGate('error',e.message);});
}
var rq=null;function scheduleRender(){if(rq)return;rq=setTimeout(function(){rq=null;render();},30);}
start();
})();
</script>
</body>
</html>
