name = "scriptorium"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# La página (HTML/JS) se sirve desde /public. Las rutas /api/* las atiende el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Valores no secretos. Los secretos (SUPABASE_*, DASH_SUPABASE_*, ANTHROPIC_API_KEY)
# se cargan en el panel de Cloudflare (Settings → Variables and Secrets).
[vars]
AGENT_MODEL = "claude-opus-5-5"
AGENT_EFFORT = "high"
