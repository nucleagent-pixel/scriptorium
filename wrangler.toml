name = "scriptorium"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# No borrar las variables que se cargan en el panel de Cloudflare al publicar.
keep_vars = true

# La página (HTML/JS) se sirve desde /public. Las rutas /api/* las atiende el Worker.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/mcp", "/mcp/*"]

# Los secretos (SUPABASE_*, DASH_SUPABASE_*, MCP_KEY) se cargan en el panel de
# Cloudflare (Settings → Variables and Secrets).

# Cada hora: ofertas nuevas del Dashboard → productos de Scriptorium.
[triggers]
crons = ["15 * * * *"]
